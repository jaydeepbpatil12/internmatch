version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: internship_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  server:
    build: ./server
    container_name: internship_server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/internship_platform
      - JWT_SECRET=dev_jwt_secret
    depends_on:
      - mongodb
    restart: unless-stopped

  client:
    build: ./client
    container_name: internship_client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongodb_data:
